<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#12110f" />
<meta name="color-scheme" content="dark" />
<title>AURA — offline</title>
<style>
  html,body{margin:0;background:#12110f;color:#f3f0ea;font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:30rem;margin:0 auto;padding:2rem 1.25rem}
  h1{font-size:1.5rem;font-weight:600;margin:0 0 .75rem}
  p{color:#c7c4bd;margin:0 0 1rem}
  button{font:inherit;font-weight:500;background:#f3f0ea;color:#12110f;border:0;border-radius:.5rem;padding:.65rem 1.1rem;min-height:44px;cursor:pointer;align-self:flex-start}
  button:focus-visible{outline:2px solid #92c1fd;outline-offset:2px}
  small{color:#9b9891;margin-top:1.5rem}
</style>
</head>
<body>
<main>
  <h1>AURA can't open yet</h1>
  <p>You are offline, and this device has not saved the app yet. Connect once and open AURA — after that it opens without a connection.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>Simulated data is always labelled as such. Not affiliated with NASA.</small>
</main>
</body>
</html>
